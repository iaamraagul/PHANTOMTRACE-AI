services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phantomtrace
      POSTGRES_USER: phantomtrace
      POSTGRES_PASSWORD: phantomtrace_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantomtrace -d phantomtrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/phantomtrace.db
      SECRET_KEY: change-this-before-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      RATE_LIMIT: 30/minute
      AUTH_RATE_LIMIT: 10/minute
      URLHAUS_ENABLED: "false"
    volumes:
      - api_data:/app/data
      - ./ml/models/production:/app/ml/models/production:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_data:
