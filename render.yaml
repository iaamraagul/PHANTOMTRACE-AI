services:
  - type: web
    name: phantomtrace-api
    env: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/phantomtrace.db
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STORE_RAW_URLS
        value: "false"
      - key: ENABLE_SHAP_EXPLANATIONS
        value: "false"
      - key: URLHAUS_ENABLED
        value: "false"
